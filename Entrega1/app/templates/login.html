<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPA — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #0b0f1a;
            color: #e0e6f0;
            overflow: hidden;
        }

        /* -------- LADO ESQUERDO (BRANDING) -------- */
        .brand-side {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(160deg, #0d1b3e 0%, #0a1628 40%, #060e1e 100%);
            overflow: hidden;
        }
        .brand-side::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56,120,255,0.12) 0%, transparent 70%);
            top: -100px; left: -150px;
        }
        .brand-side::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,200,255,0.08) 0%, transparent 70%);
            bottom: -80px; right: -100px;
        }
        .brand-content {
            position: relative; z-index: 2;
            text-align: center;
        }
        .brand-content .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #4e8cff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .brand-content .subtitle {
            font-size: 0.95rem;
            color: #7a8bb5;
            font-weight: 400;
            line-height: 1.6;
            max-width: 380px;
        }
        .brand-content .subtitle span {
            color: #5a9cff;
            font-weight: 600;
        }

        /* Partículas decorativas */
        .particles {
            position: absolute; inset: 0;
            overflow: hidden; z-index: 1;
        }
        .particles span {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(78,140,255,0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
        .particles span:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
        .particles span:nth-child(2) { left: 70%; top: 30%; animation-delay: 2s; }
        .particles span:nth-child(3) { left: 40%; top: 70%; animation-delay: 4s; }
        .particles span:nth-child(4) { left: 80%; top: 60%; animation-delay: 1s; }
        .particles span:nth-child(5) { left: 25%; top: 85%; animation-delay: 3s; }
        .particles span:nth-child(6) { left: 60%; top: 15%; animation-delay: 5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 0.7; }
        }

        /* -------- LADO DIREITO (FORM) -------- */
        .form-side {
            flex: 0.9;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f1322;
            border-left: 1px solid rgba(78,140,255,0.08);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 0 40px;
        }
        .login-card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .login-card p.desc {
            font-size: 0.85rem;
            color: #6b7a9e;
            margin-bottom: 32px;
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8a9bc0;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid rgba(78,140,255,0.15);
            border-radius: 10px;
            background: #161c30;
            color: #e0e6f0;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            outline: none;
            border-color: #4e8cff;
            box-shadow: 0 0 0 3px rgba(78,140,255,0.15);
        }
        .field input::placeholder { color: #3d4a6a; }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: #7a8bb5;
            cursor: pointer;
        }
        .remember-row input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #4e8cff;
            cursor: pointer;
        }
        .remember-row a {
            font-size: 0.82rem;
            color: #4e8cff;
            text-decoration: none;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4e8cff 0%, #2e6cdf 100%);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            letter-spacing: 0.3px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(78,140,255,0.35);
        }
        .btn-primary:active { transform: translateY(0); }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
        }
        .divider hr {
            flex: 1;
            border: none;
            border-top: 1px solid rgba(78,140,255,0.1);
        }
        .divider span {
            font-size: 0.75rem;
            color: #4a5a7e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-ava {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 10px;
            background: rgba(0,212,255,0.06);
            color: #00d4ff;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-ava:hover {
            background: rgba(0,212,255,0.12);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,212,255,0.15);
        }
        .btn-ava svg { width: 20px; height: 20px; }

        .error-msg {
            background: rgba(255,70,70,0.1);
            border: 1px solid rgba(255,70,70,0.2);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }

        /* MODAL AVA */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #151b30;
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 16px;
            padding: 36px;
            width: 420px;
            max-width: 90vw;
        }
        .modal-box h3 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: #00d4ff;
        }
        .modal-box p { font-size: 0.82rem; color: #6b7a9e; margin-bottom: 24px; }
        .modal-box .field input { background: #1a2240; }
        .modal-box .btn-primary { background: linear-gradient(135deg, #00b8d4 0%, #0088a0 100%); }
        .modal-box .btn-cancel {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #6b7a9e;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .loading-spinner {
            display: none;
            width: 20px; height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 800px) {
            body { flex-direction: column; overflow: auto; }
            .brand-side { min-height: 35vh; flex: unset; }
            .form-side { flex: unset; padding: 40px 0; }
        }
    </style>
</head>
<body>
    <!-- BRANDING -->
    <div class="brand-side">
        <div class="particles">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
        <div class="brand-content">
            <div class="logo">SIMPA</div>
            <p class="subtitle">
                <span>Sistema Inteligente</span> de Monitoramento<br>e Predição Acadêmica
            </p>
        </div>
    </div>

    <!-- FORMULÁRIO -->
    <div class="form-side">
        <div class="login-card">
            <h2>Bem-vindo de volta</h2>
            <p class="desc">Acesse sua conta para visualizar o painel acadêmico</p>

            <div id="errorBox" class="error-msg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu.email@aluno.edu.br" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="remember-row">
                    <label><input type="checkbox"> Lembre-se de mim</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="divider"><hr><span>ou</span><hr></div>

            <button class="btn-ava" onclick="openAvaModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                Entrar com o AVA
            </button>
        </div>
    </div>

    <!-- MODAL AVA -->
    <div class="modal-overlay" id="avaModal">
        <div class="modal-box">
            <h3>🔗 Sincronizar com o AVA</h3>
            <p>Insira suas credenciais do AVA da UniEVANGÉLICA. Sua senha não será armazenada.</p>
            <div id="avaErrorBox" class="error-msg"></div>
            <form onsubmit="handleAvaLogin(event)">
                <div class="field">
                    <label>RA / Usuário do AVA</label>
                    <input type="text" id="avaUser" placeholder="Seu RA" required>
                </div>
                <div class="field">
                    <label>Senha do AVA</label>
                    <input type="password" id="avaPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="avaBtnSubmit">
                    <span id="avaBtnText">Conectar ao AVA</span>
                    <div class="loading-spinner" id="avaSpinner"></div>
                </button>
                <button type="button" class="btn-cancel" onclick="closeAvaModal()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            // Login local demo — redireciona direto pro dashboard
            window.location.href = '/dashboard';
        }

        function openAvaModal() {
            document.getElementById('avaModal').classList.add('active');
        }
        function closeAvaModal() {
            document.getElementById('avaModal').classList.remove('active');
            document.getElementById('avaErrorBox').style.display = 'none';
        }

        async function handleAvaLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('avaBtnSubmit');
            const text = document.getElementById('avaBtnText');
            const spinner = document.getElementById('avaSpinner');
            const errBox = document.getElementById('avaErrorBox');

            text.style.display = 'none';
            spinner.style.display = 'block';
            errBox.style.display = 'none';
            btn.disabled = true;

            try {
                const resp = await fetch('/api/ava/dados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('avaUser').value,
                        password: document.getElementById('avaPass').value,
                    })
                });
                const data = await resp.json();
                if (!resp.ok) {
                    errBox.textContent = data.error || 'Erro ao conectar';
                    errBox.style.display = 'block';
                } else {
                    sessionStorage.setItem('ava_data', JSON.stringify(data));
                    window.location.href = '/dashboard';
                }
            } catch (err) {
                errBox.textContent = 'Erro de conexão com o servidor';
                errBox.style.display = 'block';
            } finally {
                text.style.display = 'inline';
                spinner.style.display = 'none';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
